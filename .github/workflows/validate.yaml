on:
  pull_request:

jobs:
  deploy:
    name: "Validate"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v3"
      - uses: "actions/setup-node@v3"
        with:
          node-version: "23.6"
          cache-dependency-path: "yarn.lock"
      - name: "Install dependencies"
        run: "yarn install --frozen-lockfile"
      - name: "Validate & Diff"
        run: "yarn run validate && yarn run diff"
